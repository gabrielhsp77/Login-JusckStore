<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jusk Store</title>

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/stylelogin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <a class="brand" href="login.html" aria-label="Jusk Store">
                <img src="img/logo.png" alt="Logo da Jusk Store">
            </a>

            <div class="social-links">
                    <a
                        href="https://www.instagram.com/juskstore_?igsh=d3M5b2FzZGtkMGtx"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Instagram da Jusk Store"
                    >
                        <img src="img/instagram.png" alt="">
                    </a>

                    <a
                        href="https://wa.me/5516997616509"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="WhatsApp da Jusk Store"
                    >
                        <img src="img/whatsapp.png" alt="">
                    </a>
            </div>
        </nav>
    </header>

    <main class="login-page">
        <section class="store-info">
            <img
                class="store-logo"
                src="img/logo.png"
                alt="Logo da Jusk Store"
            >

            <h2>JuskStore</h2>
            <p>vista sua melhor<br>versão</p>
        </section>

        <section class="login-box">
            <div class="user-icon">
                <img
                    src="img/Icone-pessoa-box.png"
                    alt="Ícone de usuário"
                >
            </div>

            <h1>Entrar na sua conta</h1>

            <form id="formLogin">
                <div class="input-box">
                    <img class="field-icon" src="img/usuario.png" alt="">

                    <input
                        type="text"
                        name="login"
                        placeholder="Digite seu email ou telefone"
                        autocomplete="username"
                        aria-label="Email ou Telefone"
                        required
                    >
                </div>

                <div class="input-box senha-box">
                    <img class="field-icon" src="img/senha.png" alt="">

                    <input
                        id="senha"
                        type="password"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        aria-label="Senha"
                        required
                    >

                    <button
                        class="toggle-senha"
                        type="button"
                        id="toggleSenha"
                        aria-label="Mostrar senha"
                        aria-pressed="false"
                    >
                        <img
                            id="iconeOlho"
                            src="img/olho-aberto.png"
                            alt=""
                        >
                    </button>
                </div>

                <button class="btn" type="submit">Entrar</button>

                <div class="forgot-password">
                    <a href="#">Esqueceu sua senha?</a>
                </div>

                
            </form>

            <div class="cadastro">
                <span>Ainda não possui uma conta?</span>
                <a href="cadastro.html">Criar conta <span class="seta">→</span></a>
            </div>

        </section>
    </main>

    <footer class="footer">
        <img src="img/escudo.png" alt="Segurança">
        <span>JuskStore © 2026 - Todos os direitos reservados.</span>
    </footer>

    <script>
        const campoSenha = document.getElementById("senha");
        const botaoSenha = document.getElementById("toggleSenha");
        const iconeOlho = document.getElementById("iconeOlho");

        botaoSenha.addEventListener("click", () => {
            const senhaVisivel = campoSenha.type === "text";

            campoSenha.type = senhaVisivel ? "password" : "text";
            iconeOlho.src = senhaVisivel
                ? "img/olho-aberto.png"
                : "img/olho-fechado.png";

            botaoSenha.setAttribute(
                "aria-label",
                senhaVisivel ? "Mostrar senha" : "Ocultar senha"
            );
            botaoSenha.setAttribute("aria-pressed", String(!senhaVisivel));
        });
    </script>

</body>
</html>
